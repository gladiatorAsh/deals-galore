# deals-galore configuration (public; this repo is public).
# Gift profiles for family members are NOT here; see gifts.example.yaml.

settings:
  max_age_hours: 48          # ignore posts older than this
  instant_threshold: 0.8     # push alert immediately at or above this score
  digest_threshold: 0.5      # include in the daily digest at or above this score
  max_llm_batches_per_run: 6 # each batch scores up to batch_size deals in ONE request
  batch_size: 15
  history_days: 90           # window for "is this really a low price?" checks
  retention_days: 60         # how long seen deals are kept in data/deals.json
  request_timeout: 20
  user_agent: "deals-galore/0.1 (+https://github.com/gladiatorAsh/deals-galore)"
  exclude_keywords: ["for parts", "expired", "dead deal", "[wtb]", "[wtt]",
                     # accessories / fakes that look like watch or bag deals
                     "watch band", "watch strap", "replacement band", "screen protector",
                     "replica", "dupe", "inspired by"]

# Free, OpenAI-compatible providers, tried in order. Each needs a free API key
# saved as a repository secret; you only need one. Without any key, scoring
# falls back to simple keyword/price rules. (GitHub Models retired July 2026.)
llm:
  providers:
    - name: groq                     # console.groq.com, no credit card
      base_url: https://api.groq.com/openai/v1
      # Preference order. If all are retired, the scanner picks one the key can use.
      model: [openai/gpt-oss-120b, openai/gpt-oss-20b, llama-3.1-8b-instant]
      api_key_env: GROQ_API_KEY
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: [gemini-3.5-flash-lite, gemini-2.5-flash]
      api_key_env: GEMINI_API_KEY

# Add or remove sources freely. Types: slickdeals, reddit, rss, bestbuy.
# Current focus: watches and designer purses.
sources:
  - type: slickdeals
    feeds: [frontpage, popular]
    search_watchlist: true     # runs a Slickdeals search for each watchlist item with search on
    # Brand searches catch deals that never reach the front page. They cost no
    # LLM calls unless a result matches the watchlist below.
    searches:
      # watches
      - seiko watch
      - tissot watch
      - citizen watch
      - hamilton watch
      - orient watch
      - bulova watch
      # purses
      - coach bag
      - kate spade bag
      - michael kors bag
      - tory burch bag
      - longchamp
      - marc jacobs bag

  # All subreddits are fetched in ONE request (Reddit rate-limits repeat calls).
  # r/Watchexchange = pre-owned watches sold by individuals ([WTS] posts): often
  # the best value on good brands, but check the seller's history before buying.
  - type: reddit
    subreddits: [deals, frugalfemalefashion, frugalmalefashion, Watchexchange]
    sort: new

  # Deal articles from news and shopping sites (People, NY Post, Today, ...).
  - type: rss
    name: news
    urls:
      - "https://news.google.com/rss/search?q=%22coach+outlet%22+OR+%22coach%22+bag+sale+when:2d&hl=en-US&gl=US&ceid=US:en"
      - "https://news.google.com/rss/search?q=handbag+OR+purse+sale+(%22kate+spade%22+OR+%22michael+kors%22+OR+%22tory+burch%22)+when:2d&hl=en-US&gl=US&ceid=US:en"
      - "https://news.google.com/rss/search?q=(%22watch+deal%22+OR+%22watch+sale%22+OR+%22watches+on+sale%22)+(seiko+OR+citizen+OR+tissot+OR+hamilton+OR+bulova)+when:2d&hl=en-US&gl=US&ceid=US:en"

  # Deal blog with frequent Coach Outlet / Kate Spade / Michael Kors posts.
  - type: rss
    name: hip2save
    url: https://hip2save.com/feed/

  # Brand stores' own sale sections, with real sale vs. original prices.
  # Stores with nothing on sale return 0 until their next sale.
  - type: shopify
    name: brand
    stores:
      - https://www.dagnedover.com
      - https://www.loandsons.com
      - https://www.mzwallace.com
      - https://www.cuyana.com
      - https://www.mansurgavriel.com
      - https://www.staud.clothing
      - https://www.timex.com
      - https://www.vaerwatches.com
      - https://lorierwatches.com

  # Deal aggregators: editors and communities post deals from every major
  # retailer (Costco, Walmart, Target, Macy's, Nordstrom, Amazon, Best Buy,
  # brand outlets...). Most stores publish no feed of their own and block
  # scrapers, so these are how the scanner covers them.
  - type: rss
    name: dealnews
    urls:
      - https://www.dealnews.com/?rss=1&sort=time          # newest
      - https://www.dealnews.com/?rss=1&sort=hotness       # most popular
      - https://www.dealnews.com/f1682/Staff-Pick/?rss=1   # editors' choice

  # Any RSS/Atom feed works:
  # - type: rss
  #   name: my-favorite-blog
  #   url: https://example.com/deals/feed

  # Needs a free BESTBUY_API_KEY secret (developer.bestbuy.com):
  # - type: bestbuy
  #   skus: [6505727]

# What to watch for.
#   match:   words that must ALL appear in the title
#   any_of:  groups of alternatives; the title needs one term from EACH group
#   max_price: alert at or below this price (omit to let the scorer judge value)
# The dashboard's Watch button adds specific items here.
watchlist:
  - item: Watches
    search: false              # covered by the brand searches above
    any_of:
      - [seiko, grand seiko, tissot, citizen, hamilton, longines, omega, tag heuer, tudor,
         oris, bulova, orient, movado, rado, mido, certina, frederique constant, nomos,
         sinn, victorinox, breitling, cartier, timex, vaer, lorier]
      - [watch, chronograph, timepiece, diver, automatic, wts]   # wts = r/Watchexchange sale post

  - item: Designer purses
    search: false
    any_of:
      - [coach, kate spade, michael kors, tory burch, marc jacobs, longchamp, furla,
         rebecca minkoff, mulberry, burberry, ferragamo, gucci, prada, saint laurent, ysl,
         fendi, chloe, celine, givenchy, mz wallace, dagne dover, cuyana, lo & sons,
         mansur gavriel, staud]
      - [purse, handbag, bag, tote, crossbody, satchel, clutch, hobo, shoulder bag]

# Retailers to recognize in deal posts ("... at Costco"); shown on alerts and
# the dashboard. Add any store. Set only_stores to ignore deals from others.
stores:
  - Costco
  - Walmart
  - Target
  - Amazon
  - Best Buy
  - Macy's
  - Nordstrom
  - Nordstrom Rack
  - Bloomingdale's
  - Saks Fifth Avenue
  - Saks Off 5th
  - Neiman Marcus
  - Last Call
  - Kohl's
  - JCPenney
  - Dillard's
  - TJ Maxx
  - Marshalls
  - Ross
  - Burlington
  - Zappos
  - Jomashop
  - Ashford
  - Coach Outlet
  - Kate Spade Outlet
  - Michael Kors
  - Tory Burch
  - Fossil
  - Kay Jewelers
  - Zales
  - Macy's Backstage
  - eBay
  - Woot
  - Gap Factory
  - Banana Republic Factory
only_stores: []   # e.g. [Costco, Walmart, Nordstrom Rack]

dashboard:
  enabled: true
  min_score: 0.5          # deals at or above this score are marked Top pick
  max_items: 100
  output: docs/index.html
  # Also list recent watchlist matches of any score. Set browse_only_matches: false
  # to add the whole Slickdeals front page as "Other deals".
  browse_only_matches: true
  browse_sources: [slickdeals:frontpage, slickdeals:popular]
  browse_hours: 48
  browse_items: 80
  repo: gladiatorAsh/deals-galore   # where the dashboard's Watch button opens issues
  timezone: America/Los_Angeles     # times on the dashboard (Pacific)
