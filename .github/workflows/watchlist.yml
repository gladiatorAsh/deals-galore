name: Add to watchlist

# The dashboard's "Watch" button opens a pre-filled issue titled "Watch: ...".
# Only issues opened by the repository owner are applied; anyone else's are ignored.
on:
  issues:
    types: [opened]

permissions:
  contents: write   # commit config.yaml
  issues: write     # comment on and close the request
  actions: write    # kick off a scan right away

concurrency:
  group: deals-store
  cancel-in-progress: false

jobs:
  add:
    if: >-
      startsWith(github.event.issue.title, 'Watch:') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Update config.yaml
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}   # passed as data, never run as shell
        run: |
          set +e
          python -m dealsgalore watch-add > result.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat result.txt

      - name: Commit
        if: steps.add.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "watchlist: add from issue #${{ github.event.issue.number }}"
          git pull --rebase --autostash
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.add.outputs.status == '0' }}
        run: |
          if [ "$OK" = "true" ]; then
            { cat result.txt; echo; echo "A scan has started; matching deals will alert you on Telegram."; } > reply.txt
            gh issue comment "$NUMBER" --body-file reply.txt
            gh issue close "$NUMBER" --reason completed
            gh workflow run scan.yml || true
          else
            { cat result.txt; echo; echo "Edit the YAML block in this issue's description and open a new one, or edit config.yaml directly."; } > reply.txt
            gh issue comment "$NUMBER" --body-file reply.txt
            exit 1
          fi
